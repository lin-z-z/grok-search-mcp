name: Deploy Cloudflare Worker

# Usage:
# 1) Add GitHub Secrets:
#    - CLOUDFLARE_API_TOKEN
#    - CLOUDFLARE_ACCOUNT_ID
#    - GROK_BASE_URL
#    - GROK_API_KEY
#    - GROK_PUBLIC_TOKEN
# 2) Push to the worker branch to trigger deployment.

on:
  push:
    branches:
      - worker
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node.js for Wrangler
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Write Worker secrets (avoid plaintext in repo)
      - name: Configure secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROK_BASE_URL: ${{ secrets.GROK_BASE_URL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_PUBLIC_TOKEN: ${{ secrets.GROK_PUBLIC_TOKEN }}
        run: |
          printf '%s' "$GROK_BASE_URL" | npx wrangler secret put GROK_BASE_URL
          printf '%s' "$GROK_API_KEY" | npx wrangler secret put GROK_API_KEY
          printf '%s' "$GROK_PUBLIC_TOKEN" | npx wrangler secret put GROK_PUBLIC_TOKEN

      # Deploy Worker
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
